# 对外入口。先只开 80（备案 / 证书好了再加 443 的 server 块）。
#   /api/      -> 平台后端
#   /v1/       -> New API（买方的 OpenAI 兼容接口；也可以单独给 api.<域名> 一个 server 块）
#   其余       -> 前端静态文件（deploy/site，等前端做好再放）
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    location ^~ /.well-known/acme-challenge/ { root /usr/share/nginx/html; default_type text/plain; }

    location /api/ {
        set $tm_api http://api:8000;
        proxy_pass $tm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /health { set $tm_api http://api:8000; proxy_pass $tm_api; }

    # 买方调用：长连接、流式，超时放宽
    location /v1/ {
        set $tm_newapi http://new-api:3000;
        proxy_pass $tm_newapi;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 64m;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
